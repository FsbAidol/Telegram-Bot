# nginx-emoji-studio.conf — HTTPS-проксия для мини-приложения «Эмодзи-студия»
#
# Заменить your-domain.example.com на реальный домен, затем:
#   sudo certbot --nginx -d your-domain.example.com

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;
    # HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.example.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 16m;

    # Проксируем все запросы к Java/Python мини-приложению на 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS-заголовки от приложения проходят дальше (одна и та же origin)
    }

    # Сертификаты обновляются certbot'ом автоматически
}
